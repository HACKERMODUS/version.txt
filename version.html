<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .version-container {
            background: white;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .version {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 0;
        }
        .loading {
            color: #999;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="version-container">
        <div class="label">Version</div>
        <div class="version" id="version">Lädt...</div>
        <div class="loading" id="status"></div>
    </div>

    <script>
        async function loadVersion() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/HACKERMODUS/version.txt/main/version.txt');
                if (response.ok) {
                    const version = await response.text();
                    document.getElementById('version').textContent = version.trim();
                    document.getElementById('status').textContent = '';
                } else {
                    document.getElementById('status').textContent = 'Fehler beim Laden';
                }
            } catch (error) {
                document.getElementById('status').textContent = 'Verbindungsfehler';
                console.error('Error:', error);
            }
        }

        // Initial load
        loadVersion();

        // Refresh every 5 minutes (300000ms)
        setInterval(loadVersion, 300000);
    </script>
</body>
</html>
